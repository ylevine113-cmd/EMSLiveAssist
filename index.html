<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMS Field Assistant V5 · Standalone Preview</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#162439;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#ee671b;color:white;padding:16px 14px;font-weight:800;font-size:20px;position:sticky;top:0;z-index:2}.wrap{max-width:850px;margin:auto;padding:14px 12px 90px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 15px;background:#e5eaf1;color:#18283c;font-weight:700;min-height:58px}button.active,button.primary{background:#f16c22;color:#fff}button.danger{background:#991e27;color:#fff}button:disabled{opacity:.45}nav button{white-space:nowrap}h2{margin:0 0 12px}h3{margin:17px 0 10px}.panel{background:white;border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 1px 8px #1524380d}.muted{color:#607086}.field{display:block;font-weight:650;margin:12px 0}.field input,.field select,.field textarea{margin-top:6px;width:100%;border:1px solid #cbd3df;border-radius:10px;padding:12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.status{font-size:12px;float:right;font-weight:500}.big{font-size:31px;font-variant-numeric:tabular-nums}.giant{font-size:54px;font-variant-numeric:tabular-nums;text-align:center;font-weight:900}.counterButton{min-height:116px;font-size:25px}.option{background:#edf0f5}.option.selected{background:#182d45;color:white}.tag{display:inline-block;padding:4px 8px;border-radius:7px;background:#eef1f5;font-size:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.highlight{padding:11px;border-left:4px solid #ee671b;background:#fff2e9;border-radius:8px;margin:10px 0}.safe{background:#e4f3e7;padding:8px;border-radius:8px}.history{padding:12px;border-bottom:1px solid #e1e6ed}.history:last-child{border:0}pre{white-space:pre-wrap;word-break:break-word}body.fieldmode button{min-height:62px}body.fieldmode .counterButton{min-height:142px;font-size:27px}small{color:#687689}#screen{min-height:55vh}@media (min-width:700px){.wrap{padding:22px}header{padding-left:calc((100% - 830px)/2)}}
</style></head><body><header>✚ EMS Field Assistant V5 <span id="saveStatus" class="status">Offline-ready</span></header><div class="wrap"><nav id="nav"></nav><div id="screen"></div></div><script>
// Local-only prototype. Sensitive data must not be stored in this demo for real patients.
const KEY='ems_demo_incidents_v1', ACTIVE='ems_demo_active_v1';const names={cardiac:'Chest pain / Cardiac',stroke:'Suspected stroke',seizure:'Seizure',breathing:'Breathing difficulty',trauma:'Trauma / Head injury',burn:'Burns',altered:'Altered consciousness',allergy:'Allergic reaction',other:'Other / Unknown'};
const stages=['Dispatch','Scene / ABCDE','Vitals','Focused assessment','Treatment / Reassessment','Handoff / PCR'];let view='call',stage=0,fieldMode=false;
const id=()=>`${Date.now()}-${Math.random().toString(36).slice(2,7)}`;const stamp=()=>new Date().toISOString();const localTime=x=>x?new Date(x).toLocaleString('en-GB',{hour12:false}):'Unknown';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({id:id(),created:stamp(),updated:stamp(),state:'draft',type:'other',age:'',sex:'',notes:{},flags:{},vitals:[],scores:[],actions:[],timeline:[],disposition:'',stage:0});
let incidents=[];try{incidents=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let activeId=localStorage.getItem(ACTIVE);let call=incidents.find(i=>i.id===activeId&&i.state==='draft');if(!call){call=empty();incidents.unshift(call);activeId=call.id}
stage=call.stage||0;
function save(){call.updated=stamp();call.stage=stage;incidents=incidents.map(i=>i.id===call.id?call:i);localStorage.setItem(KEY,JSON.stringify(incidents));localStorage.setItem(ACTIVE,call.id);document.getElementById('saveStatus').textContent='✓ Saved locally'}
function log(message){call.timeline.push({at:stamp(),message});save()}
const $=sel=>document.querySelector(sel);const btn=(text,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${text}</button>`;
const input=(label,key,kind='text')=>`<label class="field">${label}<input type="${kind}" data-note="${key}" value="${safe(call.notes[key]||'')}"></label>`;
const area=(label,key)=>`<label class="field">${label}<textarea data-note="${key}">${safe(call.notes[key]||'')}</textarea></label>`;
function activate(v){view=v;render()};function setStage(x){stage=Math.max(0,Math.min(stages.length-1,x));save();render()};function setType(v){call.type=v;save();render()};function flag(k,v){call.flags[k]=v;save();render()};function change(k,v){call[k]=v;save();render()}
function render(){const nav=[['call','Active call'],['counter','Counters / CPR'],['history','History']];$('#nav').innerHTML=nav.map(([k,t])=>btn(t,`activate('${k}')`,view===k?'active':'')).join('')+btn(fieldMode?'Normal UI':'Glove mode','toggleField()');const screen=$('#screen');screen.innerHTML=view==='call'?renderCall():view==='history'?renderHistory():renderCounter();document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{call.notes[el.dataset.note]=el.value;save()}))}
function toggleField(){fieldMode=!fieldMode;document.body.classList.toggle('fieldmode',fieldMode);render()}
function switchCall(i){if(i.state!=='draft')return;call=i;stage=i.stage||0;save();view='call';render()}
function newCall(){if(!confirm('Start a NEW incident? Existing entries stay in History.'))return;call=empty();incidents.unshift(call);stage=0;save();view='call';render()}
function complete(){if(!confirm('Mark this incident completed and archive the PCR? You can still view/export it in History.'))return;call.state='completed';call.completed=stamp();log('Call marked completed');call=empty();incidents.unshift(call);stage=0;save();view='history';render()}
function renderCall(){return `<section class="panel"><div class="row"><h2>Active incident</h2><span class="tag">${safe(call.state)} · ${localTime(call.created)}</span></div><label class="field">Call type<select onchange="setType(this.value)">${Object.entries(names).map(([k,n])=>`<option value="${k}" ${call.type===k?'selected':''}>${n}</option>`).join('')}</select></label><div class="grid"> <label class="field">Age / approximate age<input value="${safe(call.age)}" onchange="change('age',this.value)"></label><label class="field">Sex<select onchange="change('sex',this.value)"><option value="">Unknown</option>${['Female','Male','Other / unspecified'].map(s=>`<option ${call.sex===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="row"><small>Step ${stage+1} of ${stages.length}</small>${btn('New call','newCall()')}</div><nav>${stages.map((s,i)=>btn((i+1)+'. '+s,`setStage(${i})`,stage===i?'active':'' )).join('')}</nav></section>${stageContent()}<section class="panel"><div class="grid">${btn('← Previous',`setStage(${stage-1})`,'')}${stage<stages.length-1?btn('Next →',`setStage(${stage+1})`,'primary'):btn('Finish & archive','complete()','primary')}</div><p class="muted">Steps do not reset automatically. Each entry is saved in this browser until the record is archived. Never use real patient information in this unencrypted demo.</p></section>`}
function stageContent(){if(stage===0)return `<section class="panel"><h2>Dispatch / En route</h2>${input('Dispatch complaint','dispatch')}${area('Hazards / preparation / equipment','prep')}${input('Dispatch time (if known)','dispatchTime')}<div class="highlight">Scene safety, PPE and dispatch/ALS coordination take priority over app interaction.</div></section>`;
if(stage===1)return `<section class="panel"><h2>Scene and primary assessment</h2>${area('Observed scene, patient position and responsiveness','scene')}${area('Airway, breathing, circulation, major bleeding and immediate threats','abcde')}${area('Resources requested / arrival (MADA, ALS, etc.)','resources')}<div class="highlight">Assess and treat immediate threats under your currently authorized protocol. Do not delay care to complete the app.</div></section>`;
if(stage===2)return `<section class="panel"><h2>Vitals</h2><p class="muted">Every saved measurement gets its own timestamp, retaining repeated readings.</p><div class="grid">${['BP','Pulse','SpO₂','Respiratory rate','Blood glucose','Temperature','AVPU'].map((a,i)=>`<label class="field">${a}<input id="v${i}" placeholder="${['120/80','82','97','16','105','36.8','A'][i]}"></label>`).join('')}</div>${btn('Save vital-sign set','saveVitals()','primary')}<h3>Saved readings</h3>${call.vitals.length?call.vitals.map(v=>`<div class="history"><b>${localTime(v.at)}</b><div>${Object.entries(v.values).map(([k,x])=>safe(k)+': '+safe(x)).join(' · ')}</div></div>`).join(''):'No readings saved yet.'}</section>`;
if(stage===3)return renderFocused();if(stage===4)return `<section class="panel"><h2>Treatment and reassessment</h2>${area('Interventions (document only those actually performed, and by whom)','treatmentEntry')}${btn('Record intervention note with time','addAction()','primary')}<h3>Documented actions</h3>${call.actions.map(a=>`<div class="history">${localTime(a.at)} · ${safe(a.text)}</div>`).join('')||'None recorded'}${area('Changes, repeat examinations, patient response','reassess')}<div class="row">${btn('Add repeat vitals','setStage(2)')}${btn('Assessment / score','setStage(3)')}</div></section>`;
return `<section class="panel"><h2>Handoff & PCR</h2>${area('Handoff to MADA / ALS: who, when, and observations','handoff')}${area('Disposition / transport / refusal / left scene','dispositionNote')}<div class="grid">${btn('Copy PCR summary','copyPCR()','primary')}${btn('Export PCR text','exportPCR()')}</div><h3>PCR preview (working draft)</h3><pre>${safe(pcr(call))}</pre><div class="highlight">Review before submitting. This app does not send or submit official Ichud records.</div></section>`}
function saveVitals(){const labels=['BP','Pulse','SpO2','RR','Glucose','Temperature','AVPU'];const values={};labels.forEach((k,i)=>{const v=$('#v'+i).value.trim();if(v)values[k]=v});if(!Object.keys(values).length){alert('Enter at least one measurement.');return}call.vitals.push({at:stamp(),values});log('Vitals documented');render()}
function addAction(){const s=(call.notes.treatmentEntry||'').trim();if(!s)return alert('Enter an action first.');call.actions.push({at:stamp(),text:s});call.notes.treatmentEntry='';log('Treatment note recorded');render()}
const scoreNames={gcs:'Glasgow Coma Scale',stroke:'BE-FAST stroke screen',seizure:'Seizure assessment',resp:'Respiratory distress assessment',burn:'Burn assessment'};
function applicable(){const map={stroke:['stroke'],seizure:['seizure','gcs'],breathing:['resp'],allergy:['resp'],trauma:['gcs'],burn:['burn'],altered:['gcs'],cardiac:[],other:[]};let a=new Set(map[call.type]||[]);Object.entries(call.flags).forEach(([k,v])=>{if(v)a.add(k)});return [...a]}
function renderFocused(){const keys=applicable();return `<section class="panel"><h2>Focused assessment</h2><p>Suggested for: <b>${safe(names[call.type])}</b>. Only relevant scales are shown.</p>${keys.length?keys.map(k=>`<div class="history"><div class="row"><b>${scoreNames[k]}</b>${btn('Open',`showScale('${k}')`,'primary')}</div></div>`).join(''):'<p class="muted">No specialty scale is automatically required for this complaint. Continue the clinical assessment.</p>'}<h3>New findings?</h3><p class="muted">If your initial complaint was incomplete, activate the relevant tool without changing the call type.</p>${Object.keys(scoreNames).filter(k=>!keys.includes(k)).map(k=>`<label style="display:block;padding:8px"><input type="checkbox" ${call.flags[k]?'checked':''} onchange="flag('${k}',this.checked)"> ${scoreNames[k]}</label>`).join('')}${area('SAMPLE / OPQRST / history / findings','historyNotes')}<div id="scaleArea"></div><h3>Saved assessments</h3>${call.scores.map(x=>`<div class="history">${localTime(x.at)} · <b>${safe(scoreNames[x.kind])}</b> · ${safe(x.summary)}</div>`).join('')||'None yet.'}</section>`}
function showScale(k){const dest=$('#scaleArea');const choices=(key,title,opts)=>`<label class="field">${title}<select id="s_${key}"><option value="">Not assessed</option>${opts.map(([v,t])=>`<option value="${safe(v)}">${safe(t)}</option>`).join('')}</select></label>`;let html=`<div class="panel" style="background:#f4f7fc"><h3>${scoreNames[k]}</h3>`;
if(k==='gcs'){html+=choices('eye','Eye opening (E)',[[4,'4 Spontaneous'],[3,'3 To sound'],[2,'2 To pressure'],[1,'1 None'],['NT','Not testable']])+choices('verbal','Verbal response (V)',[[5,'5 Oriented'],[4,'4 Confused'],[3,'3 Words'],[2,'2 Sounds'],[1,'1 None'],['NT','Not testable']])+choices('motor','Motor response (M)',[[6,'6 Obeys commands'],[5,'5 Localizes'],[4,'4 Normal flexion / withdrawal'],[3,'3 Abnormal flexion'],[2,'2 Extension'],[1,'1 None'],['NT','Not testable']]);}
if(k==='stroke'){for(const x of ['Balance','Eyes / vision','Face symmetry','Arm drift','Speech'])html+=choices(x,x,[['Normal','Normal'],['Abnormal','Abnormal'],['Unknown','Unknown']]);html+=`<label class="field">Last known well / time (if verified)<input id="s_lkw" placeholder="Time or unknown"></label><label class="field">Blood glucose (if measured)<input id="s_glucose" placeholder="Measured value"></label>`}
if(k==='seizure'){html+=choices('activity','Patient state',[['Active','Actively seizing'],['Postictal','Postictal'],['Resolved','Resolved / alert'],['Unknown','Unknown']]);html+=`<label class="field">Onset time (known or estimated)<input id="s_onset" placeholder="e.g. witnessed 14:30"></label><label class="field">Duration / repeated episodes<input id="s_duration" placeholder="Observed duration or unknown"></label>`;html+=choices('recovery','Recovery between episodes',[['Yes','Yes'],['No','No'],['Unknown','Unknown']]);}
if(k==='resp'){for(const [key,opts] of [['speech',['Full sentences','Short phrases','Single words','Unable to speak','Not assessed']],['work',['Normal','Accessory muscles / retractions','Exhausted / poor effort','Not assessed']],['sounds',['Clear','Wheeze','Stridor','Crackles','Reduced / absent','Not assessed']],['mental',['Alert','Altered','Unresponsive','Not assessed']]])html+=choices(key,key,opts.map(o=>[o,o]));html+=`<label class="field">Respiratory rate<input id="s_rr" inputmode="numeric"></label><label class="field">SpO₂<input id="s_spo" inputmode="numeric"></label>`}
if(k==='burn'){html+=choices('cause','Burn mechanism',['Thermal','Chemical','Electrical','Radiation','Unknown'].map(o=>[o,o]));html+=choices('depth','Depth (observed)',['Superficial','Partial thickness','Full thickness','Mixed','Uncertain'].map(o=>[o,o]));html+=`<label class="field">Affected regions and estimated TBSA % (if assessed)<input id="s_tbsa" placeholder="e.g. right arm; 9% estimate"></label>`+choices('critical','Face/hands/genitals/joints/inhalation concern',[['Yes','Yes'],['No','No'],['Unknown','Unknown']]);html+=`<p class="muted">Use age-appropriate Lund-Browder or adult Rule of Nines for TBSA estimates. No automatic numeric body map in this demo.</p>`}
html+=`<div class="grid">${btn('Save assessment',`saveScale('${k}')`,'primary')}${btn('Close','closeScale()')}</div></div>`;dest.innerHTML=html;dest.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeScale(){const d=$('#scaleArea');if(d)d.innerHTML=''}
function saveScale(kind){const fields=[...document.querySelectorAll('#scaleArea [id^="s_"]')];const values=Object.fromEntries(fields.map(el=>[el.id.slice(2),el.value||'Not assessed']));let summary=Object.entries(values).map(([k,v])=>k+': '+v).join('; ');if(kind==='gcs'){const a=['eye','verbal','motor'].map(k=>Number(values[k]));if(a.every(Number.isFinite)&&a.every(v=>v>0))summary=`GCS ${a.reduce((x,y)=>x+y,0)}/15 (E${a[0]} V${a[1]} M${a[2]}); `+summary;else summary='GCS total not calculated (incomplete/untestable); '+summary}call.scores.push({kind,at:stamp(),summary,values});log(scoreNames[kind]+' recorded');render()}
function pcr(i){return [`Incident: ${names[i.type]||i.type}`,`Date/time opened: ${localTime(i.created)}`,`Approx. age: ${i.age||'Not recorded'}; sex: ${i.sex||'Not recorded'}`,`Dispatch: ${i.notes.dispatch||'Not recorded'}`,`Arrival: ${i.notes.scene||'Not recorded'}`,`Primary assessment: ${i.notes.abcde||'Not recorded'}`,`History: ${i.notes.historyNotes||'Not recorded'}`,`Vitals:`,...i.vitals.map(v=>`  ${localTime(v.at)}: ${Object.entries(v.values).map(([k,x])=>k+' '+x).join(', ')}`),`Assessments:`,...i.scores.map(s=>`  ${localTime(s.at)} ${scoreNames[s.kind]}: ${s.summary}`),`Actions:`,...i.actions.map(a=>`  ${localTime(a.at)}: ${a.text}`),`Reassessment: ${i.notes.reassess||'Not recorded'}`,`Handoff: ${i.notes.handoff||'Not recorded'}`,`Disposition: ${i.notes.dispositionNote||'Not recorded'}`].join('\n')}
function fname(i){const d=new Date(i.created);const pad=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_${(names[i.type]||'Other').replace(/[^\w ]/g,'').replace(/\s+/g,'-')}_${i.id.slice(-5)}_PCR.txt`}
function exportPCR(target){const i=target||call,blob=new Blob([pcr(i)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname(i);a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function copyPCR(){navigator.clipboard?.writeText(pcr(call)).then(()=>alert('Copied')).catch(()=>alert('Clipboard unavailable; use Export PCR text.'))}
function renderHistory(){return `<section class="panel"><div class="row"><h2>Incident history</h2>${btn('New call','newCall()','primary')}</div><label class="field">Search by complaint or date<input id="filter" placeholder="e.g. stroke or 12/10" oninput="filterHistory(this.value)"></label><div id="records">${historyRows(incidents)}</div></section><div class="highlight">Privacy notice: this standalone demo stores data unencrypted in the browser. Do not enter real patient-identifying or sensitive medical information.</div>`}
function historyRows(items){return items.map(i=>`<div class="history"><b>${safe(fname(i))}</b><div>${safe(names[i.type]||'Other')}</div> <span class="tag">${i.state}</span><div class="muted">${localTime(i.created)} · ${i.age?('Age '+safe(i.age)):'Age not recorded'} · ${i.id.slice(-5)}</div><div class="grid" style="margin-top:10px">${i.state==='draft'?btn('Resume',`switchCall(incidents.find(i=>i.id==='${i.id}'))`,'primary'):btn('View PCR',`viewRecord('${i.id}')`)}${btn('Export TXT',`exportPCR(incidents.find(i=>i.id==='${i.id}'))`)}</div></div>`).join('')||'No matching incidents.'}function filterHistory(s){$('#records').innerHTML=historyRows(incidents.filter(i=>JSON.stringify([names[i.type],localTime(i.created),i.state]).toLowerCase().includes(s.toLowerCase())))}
function viewRecord(id){const i=incidents.find(i=>i.id===id);if(!i)return;$('#records').innerHTML=`<div class="panel"><div class="row">${btn('← History','render()')}${btn('Export TXT',`exportPCR(incidents.find(i=>i.id==='${id}'))`,'primary')}</div><h3>${safe(names[i.type])}</h3><pre>${safe(pcr(i))}</pre></div>`}
let countMode='pulse',interval=15,remaining=15,running=false,ticks=0,count=0,metronome=false,bpm=110,elapsed=0,ticker=null,audio=null,lastBeat=0,lastRotate=0;
function renderCounter(){return `<section class="panel"><h2>Field Counters</h2><div class="grid three">${['pulse','breathing','cpr'].map(x=>btn(x==='cpr'?'CPR':x==='pulse'?'Pulse':'Breaths',`chooseMode('${x}')`,countMode===x?'active':'' )).join('')}</div>${countMode==='cpr'?`<h3>CPR metronome</h3><div class="giant">${bpm} <small>BPM</small></div><input style="width:100%" type="range" min="100" max="120" step="5" value="${bpm}" oninput="bpm=Number(this.value);render()"><div class="giant" id="rotTime">${timeFmt(elapsed)}</div><p class="muted" style="text-align:center">Elapsed · switch-provider alert every 2 minutes</p><div class="grid">${btn(metronome?'PAUSE':'START', 'toggleMetro()','counterButton primary')}${btn('RESET','resetMetro()','counterButton danger')}</div><p class="muted">Sound begins after you press Start. Keep this page open; browser background restrictions can affect audio. Do not use as a replacement for the AED or approved CPR guidance.</p>`:`<h3>${countMode==='pulse'?'Pulse rate':'Respiratory rate'} counter</h3><div class="grid three">${[15,30,60].map(x=>btn(x+' sec',`setIntervalSec(${x})`,interval===x?'active':'' )).join('')}</div><div class="giant" id="remaining">${remaining}s</div><div class="giant" id="tapcount">${count} taps</div><div class="grid">${btn('TAP +1','tapCount()','counterButton primary')}${btn(running?'PAUSE':'START','toggleCount()','counterButton')}${btn('RESET','resetCount()','counterButton danger')}${btn('SAVE RATE','saveCountRate()','counterButton')}</div><p class="muted">Calculated rate = taps × 60 ÷ ${interval}. For irregular respirations or pulse, count for a full 60 seconds.</p>`}</section>`}
function chooseMode(x){if(running)toggleCount();if(metronome)toggleMetro();countMode=x;render()}
function setIntervalSec(x){interval=x;resetCount()};function tapCount(){if(!running)return;count++;const e=$('#tapcount');if(e)e.textContent=count+' taps'}function toggleCount(){running=!running;if(running){ticker=setInterval(()=>{remaining=Math.max(0,remaining-1);const el=$('#remaining');if(el)el.textContent=remaining+'s';if(!remaining){running=false;clearInterval(ticker);beep(800,.18)}},1000)}else clearInterval(ticker);render()};function resetCount(){running=false;clearInterval(ticker);remaining=interval;count=0;render()};function saveCountRate(){if(running||remaining>0)return alert('Finish the complete count interval before saving.');let rate=count*60/interval;if(!count)return alert('No counts registered.');call.vitals.push({at:stamp(),values:{[countMode==='pulse'?'Pulse':'RR']:String(rate)},method:`${interval}s counter`});log('Counter reading recorded');alert('Saved '+rate+' per minute to active incident.');resetCount()}
function getAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function beep(freq=880,dur=.045){try{getAudio();if(!audio)return;let osc=audio.createOscillator(),g=audio.createGain();osc.frequency.value=freq;g.gain.value=.17;osc.connect(g);g.connect(audio.destination);osc.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);osc.stop(audio.currentTime+dur)}catch{}}
function timeFmt(x){return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`};function toggleMetro(){metronome=!metronome;if(metronome){getAudio();let ms=Date.now();lastBeat=ms;lastRotate=0;ticker=setInterval(()=>{if(!metronome)return;const now=Date.now();while(now-lastBeat>=60000/bpm){lastBeat+=60000/bpm;beep(770,.035)}elapsed=Math.floor((now-ms)/1000)+window.elapsedStart;$('#rotTime')&&($('#rotTime').textContent=timeFmt(elapsed));if(Math.floor(elapsed/120)>lastRotate){lastRotate=Math.floor(elapsed/120);beep(440,.25);if(navigator.vibrate)navigator.vibrate([250,120,250])}},25);window.elapsedStart=elapsed}else{clearInterval(ticker)}render()};function resetMetro(){if(metronome){metronome=false;clearInterval(ticker)}elapsed=0;lastRotate=0;render()};
save();render();
</script></body></html>
