name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle -p EMSLiveAssist-Android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EMSLiveAssist-APK
          path: EMSLiveAssist-Android/app/build/outputs/apk/debug/app-debug.apk
